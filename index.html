<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise for You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Kanit:wght@300;600&family=Prompt:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="main-header">Happy Valentine To Ging</h1>

    <svg class="bg-heart-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
                <stop offset="100%" style="stop-color:#ffcce0;stop-opacity:0.5" />
            </linearGradient>
        </defs>
        <path fill="url(#heartGradient)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>

    <audio id="bgMusic" loop>
        <source src="Polycat.mp4" type="audio/mp4"> 
    </audio>

    <div class="gift-container" id="giftBox" onclick="openGift()">
        <div class="gift-lid"><div class="ribbon-vertical"></div></div>
        <div class="gift-box"><div class="ribbon-vertical"></div><div class="ribbon-horizontal"></div></div>
        <div class="bow"></div>
        <div class="click-text">แตะเพื่อเปิดของขวัญ 🎁</div>
    </div>

    <div class="content-area" id="mainContent">
        <div class="media-container">
            <video id="videoPlayer" controls playsinline webkit-playsinline muted></video>
            <img id="imageViewer" class="memory-img" src="" alt="Memory">
            <button id="toggleVideoAudio" class="btn-audio" style="display:none;">เปิดเสียงคลิป 🔊</button>
        </div>

        <div class="message-box">
            <p id="messageText" class="message-text">...</p>
        </div>

        <button class="btn-next" onclick="nextMemory()">ความทรงจำถัดไป ➡️</button>
    </div>

    <script>
        // ข้อมูลความทรงจำ
        const memories = [
            {
                type: "video",
                file: "GingSmile1.mp4", 
                text: "คลิปแรกที่เธอส่งให้เค้าดู เธอน่ารักมากๆ อยากลูบหัวง่ะ"
            },
            {
                type: "image", 
                file: "ขับรถไปหากิ่งครั้งแรก.PNG", 
                text: "วันนั้นเธอฝากเค้าซื้ออมยิ้ม ได้อยู่กับเธอแป้บเดียวแต่เค้ามีความสุขมากเลย อยากอยู่กับเธอนานๆ✨"
            },
            {
                type: "video",
                file: "GingSmile2.mp4", 
                text: "เค้าชอบเวลาเธอยิ้มแบบนี้มากกกก อยากให้เธอยิ้มน่ารักแบบนี้ตลอดไปเลย 😊"
            },
            {
                type: "image", 
                file: "รูปแรกที่กิ่งส่งให้.PNG", 
                text: "วันนั้นเค้ารู้ว่าเธอน่าจะเมาอยู่ แต่ก็ไม่คิดว่าจะถ่ายรูปมาให้ดู น่ารักมากเลยนะ เค้าเอ็นดูเธอมากๆ เลย 🥰"
            },
             {
                type: "image", 
                file: "กิ่งกลับห้องแล้วทักหา.PNG", 
                text: "ตอนนั้นเค้านอนอยู่ แล้วเธอทักมาว่ากลับห้องแล้วนะ หลังจากไปดื่มมามันน่าเอ็นดูมากๆ เลย เค้าไม่คิดว่าเธอจะทักหาด้วย แถมมาบอกคิดถึงกันอีก อยากหอมหัวเธอมากกกก"
            },
            {
                type: "video",
                file: "CardForGing.mp4", 
                text: "การ์ดนี้เค้าทำวันที่เกรดออกแล้วเธอดูเครียดๆ เเล้วเค้าอยากทำให้เธอยิ้มได้เลยลองพับการ์ดดู เป็นครั้งแรกเลยที่เค้าทำให้คนคนนึง รู้สึกว่าดันชอบทำ จะทำให้เธอบ่อยๆ เลยนะ"
            },
            {
                type: "image", 
                file: "กิ่งถูกใจโน๊ต.PNG", 
                text: "แค่เธอกดถูกใจโน๊ต วันนั้นเค้าตัวลอยทั้งวันเลย ยิ้มไม่หุบ"
            },
            {
                type: "image", 
                file: "ข้อความที่ทำให้ยิ้มข้ามวันข้ามคืน.PNG", 
                text: "เค้าชอบเวลาเธอบอกเค้าว่าน่ารักมากกกก ปกติเค้าไม่ค่อยได้มีใครมาชมแบบนี้เท่าไหร่ อยากให้เธออยู่ชมเค้าแบบนี้ไปเรื่อยๆ เลย 💕"
            },
            {
                type: "image", 
                file: "กิ่งชม.PNG", 
                text: "วันนั้นเค้าไปเที่ยวเขาใหญ่กับเพื่อนๆ เค้าส่งรูปไป แล้วเธอส่งข้อความมาชมเค้า เค้าดีใจมากเลย รู้สึกว่าเธอเป็นคนที่อบอุ่นมากๆ ❤️"
            },
            {
                type: "image", 
                file: "กิ่งชม1.PNG", 
                text: "เธอชมเค้าเก่งมาก เค้าเขินจนแทบอยากจะกรี๊ดกลางป่ากลางเขา ไอ่บ้าเอ๊ยยยยย เขินเธอทุกครั้งเลยเอาจริง"
            },
             {
                type: "image", 
                file: "กิ่งถูกใจสตอรี่.PNG", 
                text: "เค้าลงรูปที่เธอชม แล้วเธอมากดใจคนแรกเลยด้วย เธอดูเป็นคนใส่ใจรายละเอียดเล็กๆ น้อยๆ เห็นแล้วใจฟูมากก อยากพาเธอมาเที่ยวด้วยกัน💖"
            },
            {
                type: "image", 
                file: "คอลกันวันแรก.PNG", 
                text: "อันนี้เป็นวันที่เราโทรคุยกันครั้งแรก แอบเกร็งปนเขินๆ แต่ก็สนุกมากเลยนะ อยากรู้จักเธอมากขึ้นในทุกๆ วัน😊"
            },
            {
                type: "image", 
                file: "วันที่รู้สึกใช่กับเธอ.PNG", 
                text: "วันนั้นเราคุยกันเรื่องที่บ้านกัน แล้วพอเธอเล่าให้เค้าฟัง เค้ารู้สึกอยากดูแลเธอมาก อยากคอยถะนุถะนอมเธอให้ดี ไม่อยากให้เธอต้องทำอะไรอยู่คนเดียว เป็นความรู้สึกที่ไม่ได้มีง่ายๆ แต่พอมีก็อยากทำให้ดีที่สุดเลย ❤️"
            },
            {
                type: "image", 
                file: "กิ่งรีโพสต์.PNG", 
                text: "เค้าแอบไปส่องตตดูว่าเธอรีโพสต์อะไรบ้าง เเล้วเค้าเห็นคลิปนี้ที่เธอรีโพสต์ เค้าดีใจมากๆ เดี๋ยวเค้าจะเป็นคนพาเธอไปทะเลเองนะคั้บ คนเก่งของเค้า "
            },
            {
                type: "image", 
                file: "กิ่งถ่ายวิวทะเล.PNG", 
                text: "เธอไปเที่ยวพัทยากับเพื่อน แล้วถ่ายรูปทะเลมาให้เค้าดู เค้าอุ่นใจมากกก ได้เห็นเธอไปเที่ยวเค้าก็มีความสุขแล้ว อยากให้เธอเอ็นจอยกับชีวิตตัวเองให้มากๆ 🌊"
            },
             {
                type: "image", 
                file: "ดอกไม้ที่กิ่งบอกว่าน่ารัก.PNG", 
                text: "เห็นเธอไปเจอสตอรี่เพื่อนแล้วบอกว่าน่ารักดี วันต่อมาเค้าเลยถ่ายมาให้เธอดู เธอดูชอบดอกไม้มากๆ ถ้าเธอได้ดอกไม้ซักช่อก็คงดีนะ 🌸"
            },
        ];

        let currentIndex = 0;
        const giftBox = document.getElementById('giftBox');
        const contentArea = document.getElementById('mainContent');
        const videoPlayer = document.getElementById('videoPlayer');
        const imageViewer = document.getElementById('imageViewer');
        const messageText = document.getElementById('messageText');
        const bgMusic = document.getElementById('bgMusic');
        const toggleBtn = document.getElementById('toggleVideoAudio');

        function openGift() {
            giftBox.style.display = 'none';
            contentArea.style.display = 'block';
            
            // ตั้งค่าเสียงเพลงพื้นหลังเริ่มต้น
            bgMusic.volume = 0.4; // ปรับความดังเพลงพื้นหลัง (0.0 - 1.0)
            bgMusic.play().catch(e => console.log("Music play failed:", e));

            loadMemory(currentIndex);
            startHearts();
        }

        function nextMemory() {
            currentIndex++;
            if (currentIndex >= memories.length) {
                currentIndex = 0;
            }
            loadMemory(currentIndex);
        }

        function loadMemory(index) {
            const data = memories[index];
            messageText.innerText = data.text;
            
            // รีเซ็ตปุ่มเสียงทุกครั้งที่เปลี่ยนหน้า
            videoAudioEnabled = false;
            toggleBtn.textContent = 'เปิดเสียงคลิป 🔊';

            if (data.type === 'video') {
                imageViewer.style.display = 'none';
                videoPlayer.style.display = 'block';
                videoPlayer.src = data.file;
                
                // วิดีโอเริ่มแบบปิดเสียง (เพลงพื้นหลังยังเล่นอยู่)
                videoPlayer.muted = true;
                
                // แสดงปุ่มเปิดเสียงคลิป
                toggleBtn.style.display = 'inline-block';
                
                videoPlayer.load();
                videoPlayer.play().catch(e => console.log("Autoplay prevented"));
            } else if (data.type === 'image') {
                videoPlayer.pause();
                videoPlayer.style.display = 'none';
                imageViewer.style.display = 'block';
                imageViewer.src = data.file;
                
                // ซ่อนปุ่มเสียงเมื่อเป็นรูปภาพ
                toggleBtn.style.display = 'none';
                
                // ถ้าเพลงพื้นหลังถูกเบาเสียงไว้ ให้กลับมาดังเท่าเดิม
                bgMusic.volume = 0.4;
            }
        }

        // --- ส่วนที่แก้ไข: จัดการเสียงคลิปและเพลงพื้นหลัง ---
        let videoAudioEnabled = false;

        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                if (!videoAudioEnabled) {
                    // เปิดเสียงคลิป (โดยไม่ปิดเพลงพื้นหลัง)
                    videoPlayer.muted = false;
                    
                    // (ลูกเล่นเสริม) เบาเสียงเพลงพื้นหลังลงนิดหน่อยเพื่อให้ได้ยินเสียงคลิปชัดขึ้น
                    // ถ้าไม่อยากให้เบาเสียง ลบบรรทัดข้างล่างนี้ออกได้เลยครับ
                    bgMusic.volume = 0.1; 

                    videoAudioEnabled = true;
                    toggleBtn.textContent = 'ปิดเสียงคลิป 🔇';
                } else {
                    // ปิดเสียงคลิป
                    videoPlayer.muted = true;
                    
                    // คืนค่าความดังเพลงพื้นหลัง
                    bgMusic.volume = 0.4;

                    videoAudioEnabled = false;
                    toggleBtn.textContent = 'เปิดเสียงคลิป 🔊';
                }
            });
        }
        // ------------------------------------------------

        function startHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = Math.random() > 0.5 ? '❤️' : '🤍';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '100vh';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }, 300);
        }
    </script>
</body>
</html>
